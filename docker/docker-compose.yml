services:
  # ═══════════════════════════════════════════════════════════════════════════
  # ORBIT - API server
  # ═══════════════════════════════════════════════════════════════════════════
  orbit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orbit-server
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - OLLAMA_HOST=172.17.0.1:11434
      - ORBIT_PRESET=llama3-3b-cpu
      - ENVIRONMENT=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - orbit-data:/orbit/data
      - orbit-logs:/orbit/logs
      - ../config:/orbit/config
      - ../.env:/orbit/.env:ro
    restart: unless-stopped

volumes:
  orbit-data:
  orbit-logs: